name: WellCheck CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB:       wellcheck_test
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create test properties
        run: |
          mkdir -p src/test/resources
          cat > src/test/resources/application-test.properties << EOF
          spring.datasource.url=jdbc:postgresql://localhost:5432/wellcheck_test
          spring.datasource.username=postgres
          spring.datasource.password=secret
          spring.jpa.hibernate.ddl-auto=create-drop
          spring.jpa.open-in-view=false
          groq.api.key=test-key
          groq.api.url=https://api.groq.com/openai/v1/chat/completions
          groq.model=llama-3.3-70b-versatile
          EOF

      - name: Build with Maven
        run: mvn clean compile -B

      - name: Run tests
        run: mvn test -B -Dspring.profiles.active=test

      - name: Package JAR
        run: mvn package -DskipTests -B

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: wellcheck-jar
          path: target/*.jar
          retention-days: 3

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t wellcheck:latest .

      - name: Confirm build
        run: docker images wellcheck

  pipeline-summary:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Summary
        run: |
          echo "==============================="
          echo "WellCheck CI/CD Pipeline PASSED"
          echo "==============================="
          echo "Branch : ${{ github.ref_name }}"
          echo "Commit : ${{ github.sha }}"
          echo "Author : ${{ github.actor }}"
          echo "==============================="
