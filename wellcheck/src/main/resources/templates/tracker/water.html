<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>WellCheck — Water Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f7f4; padding: 2rem; }
        .card { background: white; border-radius: 12px; padding: 2rem; max-width: 500px; margin: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { color: #2d6a4f; margin-bottom: 1.5rem; }
        label { font-size: 14px; color: #555; display: block; margin-bottom: 4px; }
        input { width: 100%; padding: 10px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { background: #2d6a4f; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 15px; }
        button:hover { background: #1b4332; }
        .progress-bg { background: #e0e0e0; border-radius: 10px; height: 28px; margin: 1rem 0; }
        .progress-fill { background: #52b788; height: 28px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 13px; font-weight: bold; transition: width 0.5s; }
        .warning { color: #e63946; font-weight: bold; margin-top: 8px; }
        .good { color: #2d6a4f; font-weight: bold; margin-top: 8px; }
        .nav { margin-bottom: 1.5rem; }
        .nav a { color: #2d6a4f; margin-right: 1rem; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="nav">
        <a th:href="@{/dashboard}"> Dashboard</a>
        <a th:href="@{/logout}">Logout</a>
    </div>
    <h1> Water Tracker</h1>
    <p style="color:#555;margin-bottom:1rem">Today's hydration</p>

    <div class="progress-bg">
        <div class="progress-fill"
             th:style="'width:' + ${percent} + '%'"
             th:text="${percent} + '%'">
        </div>
    </div>
    <p th:text="${log.glasses} + ' / ' + ${log.goalGlasses} + ' glasses today'"
       style="color:#555;margin-bottom:1rem"></p>

    <p class="warning" th:if="${log.glasses < log.goalGlasses}">
         Keep going! You haven't reached your goal yet.
    </p>
    <p class="good" th:if="${log.glasses >= log.goalGlasses}">
         Daily goal reached! Great job!
    </p>

    <form th:action="@{/water}" method="post" style="margin-top:1.5rem">
        <label>Glasses drunk today :</label>
        <input type="number" name="glasses" min="0" max="20" th:value="${log.glasses}" />
        <label>Your daily goal :</label>
        <input type="number" name="goal" min="1" max="20" th:value="${log.goalGlasses}" />
        <button type="submit"> Save</button>
    </form>
</div>
</body>
</html>
