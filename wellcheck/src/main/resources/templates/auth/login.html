<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>WellCheck — Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f7f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { color: #2d6a4f; margin-bottom: 1.5rem; text-align: center; }
        input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #2d6a4f; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:hover { background: #1b4332; }
        .error { color: red; font-size: 13px; margin-bottom: 10px; text-align: center; }
        .success { color: green; font-size: 13px; margin-bottom: 10px; text-align: center; }
        .link { text-align: center; margin-top: 1rem; font-size: 14px; }
        a { color: #2d6a4f; }
    </style>
</head>
<body>
<div class="card">
    <h1>💚 WellCheck</h1>
    <h2 style="text-align:center;margin-bottom:1rem;color:#555">Welcome back</h2>
    <div class="success" th:if="${param.registered}">✅ Account created! You can now login.</div>
    <div class="success" th:if="${param.logout}">👋 You have been logged out.</div>
    <div class="error" th:if="${param.error}">❌ Invalid email or password.</div>
    <form th:action="@{/login}" method="post">
        <input type="email" name="username" placeholder="Email address" />
        <input type="password" name="password" placeholder="Password" />
        <button type="submit">Login</button>
    </form>
    <div class="link">No account yet? <a th:href="@{/register}">Register here</a></div>
</div>
</body>
</html>
